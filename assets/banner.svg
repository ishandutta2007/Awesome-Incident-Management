<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380" style="background:#090d16; border-radius:14px; overflow:hidden;">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#141c33"/>
    </linearGradient>

    <!-- Glowing accent gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="badgeGradRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="badgeGradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="badgeGradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Subtle radar/scanner pattern -->
    <radialGradient id="radarSweep" cx="85%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseRing {
      0% { r: 18px; opacity: 0.9; }
      50% { r: 42px; opacity: 0.25; }
      100% { r: 65px; opacity: 0; }
    }
    @keyframes pulseRing2 {
      0% { r: 12px; opacity: 0.95; }
      60% { r: 35px; opacity: 0.3; }
      100% { r: 52px; opacity: 0; }
    }
    @keyframes sweepGlow {
      0% { opacity: 0.3; transform: scale(0.95); }
      50% { opacity: 0.65; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(0.95); }
    }
    @keyframes dashTravel {
      from { stroke-dashoffset: 400; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes floatLight {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .pulse-ring-1 {
      animation: pulseRing 3.2s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
      transform-origin: 1040px 110px;
    }
    .pulse-ring-2 {
      animation: pulseRing2 3.2s cubic-bezier(0.2, 0.8, 0.4, 1) infinite 1.2s;
      transform-origin: 1040px 110px;
    }
    .status-beacon {
      animation: pulseRing 2.6s ease-out infinite;
      transform-origin: 95px 125px;
    }
    .ecg-line {
      stroke-dasharray: 20 8;
      animation: dashTravel 12s linear infinite;
    }
    .card-float {
      animation: floatLight 4.5s ease-in-out infinite;
    }
  </style>

  <!-- 1. Background Fill -->
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>

  <!-- 2. Decorative Background Grid -->
  <g opacity="0.08" stroke="#cbd5e1" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="380"/>
    <line x1="350" y1="0" x2="350" y2="380"/>
    <line x1="550" y1="0" x2="550" y2="380"/>
    <line x1="750" y1="0" x2="750" y2="380"/>
    <line x1="950" y1="0" x2="950" y2="380"/>
    <line x1="1100" y1="0" x2="1100" y2="380"/>
  </g>

  <!-- 3. Ambient Ambient Glow Background (Kept strictly behind all text) -->
  <circle cx="1040" cy="110" r="180" fill="url(#radarSweep)" opacity="0.8"/>
  <circle cx="140" cy="280" r="140" fill="#06b6d4" opacity="0.05"/>

  <!-- 4. Dynamic Animated Signals in Deep Background / Right Side -->
  <g opacity="0.85">
    <!-- Animated radar waves from Incident Hub on top-right -->
    <circle cx="1040" cy="110" r="18" fill="none" stroke="#f43f5e" stroke-width="2.5" class="pulse-ring-1"/>
    <circle cx="1040" cy="110" r="12" fill="none" stroke="#8b5cf6" stroke-width="2" class="pulse-ring-2"/>
    <circle cx="1040" cy="110" r="8" fill="#f43f5e" filter="url(#glowEffect)"/>

    <!-- Dynamic Telemetry Wave (ECG / Health monitoring trace) along bottom -->
    <path d="M 0 325 L 260 325 L 285 305 L 305 345 L 330 295 L 355 350 L 375 325 L 750 325 L 775 308 L 795 342 L 815 300 L 835 348 L 855 325 L 1200 325"
          fill="none" stroke="#38bdf8" stroke-width="2.2" opacity="0.35" class="ecg-line"/>
  </g>

  <!-- 5. Interactive Visual Tech Elements / Floating Telemetry Cards (Right Side) -->
  <g class="card-float" transform="translate(860, 185)">
    <!-- Incident Status Card -->
    <rect x="0" y="0" width="280" height="92" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
    
    <!-- Status indicator dot & label -->
    <circle cx="24" cy="28" r="6" fill="#10b981" filter="url(#subtleGlow)"/>
    <text x="38" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#34d399" letter-spacing="0.5">SYSTEM STATUS: RESILIENT</text>
    
    <!-- Mini metrics -->
    <text x="24" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">MTTR Target</text>
    <text x="24" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">&lt; 15 mins</text>

    <text x="120" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">Escalation</text>
    <text x="120" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Automated</text>

    <text x="205" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">Coverage</text>
    <text x="205" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#a78bfa">24x7x365</text>
  </g>

  <!-- 6. FOREGROUND CONTENT: Header Bar & Tag Pills (Always sharp & in front) -->
  <g transform="translate(60, 50)">
    <!-- Top Micro-Badge -->
    <rect x="0" y="0" width="185" height="28" rx="14" fill="url(#badgeGradRed)" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="4.5" fill="#f43f5e" filter="url(#subtleGlow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#fecdd3" letter-spacing="0.8">INCIDENT RESPONSE</text>

    <!-- Secondary Micro-Badge -->
    <rect x="198" y="0" width="170" height="28" rx="14" fill="url(#badgeGradGreen)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="214" cy="14" r="4.5" fill="#10b981" filter="url(#subtleGlow)"/>
    <text x="226" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#a7f3d0" letter-spacing="0.8">SRE &amp; ON-CALL OPS</text>
  </g>

  <!-- 7. FOREGROUND CONTENT: Main Title & Subtitle (High contrast, never obscured) -->
  <g transform="translate(60, 140)">
    <!-- Main Headline with glowing accent bar on left -->
    <rect x="-16" y="0" width="5" height="52" rx="2.5" fill="url(#primaryGlow)" />
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.8">
      Awesome Incident Management
    </text>
    
    <!-- Subtitle / Mission Statement -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      Curated directory of enterprise SaaS platforms &amp; sovereign open-source incident response systems
    </text>

    <!-- Key Core Capability Pills -->
    <g transform="translate(0, 110)">
      <!-- Pill 1: Alert Routing -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="138" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="12" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">🚨 Alert Routing</text>
      </g>
      <!-- Pill 2: On-Call Scheduling -->
      <g transform="translate(148, 0)">
        <rect x="0" y="0" width="168" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="12" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">📞 On-Call Rotations</text>
      </g>
      <!-- Pill 3: Automated Escalation -->
      <g transform="translate(326, 0)">
        <rect x="0" y="0" width="176" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="12" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">⚡ Auto-Escalation</text>
      </g>
      <!-- Pill 4: Post-Incident Reviews -->
      <g transform="translate(512, 0)">
        <rect x="0" y="0" width="164" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="12" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">📊 Post-Mortems</text>
      </g>
    </g>
  </g>

  <!-- 8. Subtle Outer Border Glow -->
  <rect x="0.5" y="0.5" width="1199" height="379" rx="13.5" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>
</svg>